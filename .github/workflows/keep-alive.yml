name: Keep Supabase Alive

on:
  schedule:
    # every 3 days, well under Supabase's 7-day inactivity pause threshold
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit health check endpoint
        run: |
          url="${{ vars.APP_URL || 'https://dev-pulse-one-xi.vercel.app' }}/api/health"
          echo "Pinging $url"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          echo "Response status: $status"
          if [ "$status" -ne 200 ]; then
            echo "Health check failed with status $status"
            exit 1
          fi
